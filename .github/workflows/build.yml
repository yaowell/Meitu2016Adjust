name: Build Meitu2016Adjust

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project Meitu2016Adjust.xcodeproj \
            -scheme Meitu2016Adjust \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Meitu2016Adjust.app Payload/
          zip -r Meitu2016Adjust.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Meitu2016Adjust-IPA
          path: Meitu2016Adjust.ipa